<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23110d0f' stroke='%23e0202c' stroke-width='4'/%3E%3Cg stroke='%23e0202c' stroke-width='4' fill='none' stroke-linecap='round'%3E%3Cpath d='M44 52 22 34 14 56M44 56 18 52 12 74M56 52 78 34 86 56M56 56 82 52 88 74'/%3E%3C/g%3E%3Cellipse cx='50' cy='60' rx='11' ry='15' fill='%23110d0f' stroke='%23e0202c' stroke-width='4'/%3E%3Ccircle cx='50' cy='40' r='8' fill='%23110d0f' stroke='%23e0202c' stroke-width='4'/%3E%3Ccircle cx='47' cy='39' r='2' fill='%23fff'/%3E%3Ccircle cx='53' cy='39' r='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0a0809; --card:#17131a; --line:#2c2329; --txt:#f1ece8; --mut:#9a9096; --red:#e0202c; --red2:#ff4a54; --you:#2a2226; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  input,textarea { font:inherit; color:var(--txt); }
  .app { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--line); background:rgba(10,8,9,.92); backdrop-filter:blur(10px); }
  header h1 { margin:0; font-size:18px; letter-spacing:.24em; color:var(--red2); flex:1; }
  header small { display:block; font-size:11px; letter-spacing:.04em; color:var(--mut); }
  .ib { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:19px; background:var(--card); border:1px solid var(--line); }
  #log { flex:1; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:12px; }
  .m { max-width:86%; padding:10px 14px; border-radius:18px; white-space:pre-wrap; word-wrap:break-word; }
  .m.you { align-self:flex-end; background:var(--you); border-bottom-right-radius:6px; }
  .m.ven { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px; }
  .m.ven b.n { display:block; font-size:11px; letter-spacing:.18em; color:var(--red2); margin-bottom:2px; }
  .m.sys { align-self:center; font-size:12.5px; color:var(--mut); text-align:center; max-width:94%; }
  .dots span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--red2); animation:b 1s infinite; }
  .dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-4px)} }
  footer { padding:8px 10px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg); }
  .comp { display:flex; align-items:flex-end; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:6px; }
  .comp textarea { flex:1; resize:none; border:0; outline:0; background:transparent; padding:8px 6px 8px 10px; max-height:140px; }
  .round { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-size:18px; flex:none; }
  #send { background:var(--red); color:#fff; } #mic { background:#2a2226; }
  #mic.on { background:var(--red2); color:#fff; animation:p 1.2s infinite; }
  @keyframes p { 0%{box-shadow:0 0 0 0 rgba(255,74,84,.6)} 100%{box-shadow:0 0 0 14px rgba(255,74,84,0)} }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:20; }
  .sheet.open { display:block; }
  .panel { position:absolute; left:0; right:0; bottom:0; max-height:88dvh; overflow:auto; background:#120e11; border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .drawer .panel { top:0; bottom:0; right:auto; width:min(320px,84vw); border-radius:0 20px 20px 0; max-height:none; padding-top:calc(18px + env(safe-area-inset-top)); }
  .panel h2 { margin:0 0 12px; font-size:18px; }
  label { display:block; font-size:12px; color:var(--mut); margin:12px 0 4px; letter-spacing:.04em; }
  .f { width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; outline:0; }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { background:var(--red); color:#fff; border-radius:12px; padding:11px 16px; font-weight:600; }
  .btn2 { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .tog { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .tog input { width:22px; height:22px; accent-color:var(--red); }
  .hint { font-size:12px; color:var(--mut); }
  .chat-item { padding:12px 10px; border-radius:12px; display:flex; gap:8px; align-items:center; }
  .chat-item.cur { background:var(--card); }
  .chat-item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #lock { position:fixed; inset:0; z-index:50; background:radial-gradient(circle at 50% 30%, #2a0a0e, var(--bg) 60%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
  #lock h1 { margin:6px 0 0; letter-spacing:.3em; color:var(--red2); font-size:26px; }
  #lock .f { text-align:center; max-width:280px; font-size:18px; }
  #lockmsg { color:var(--red2); min-height:20px; font-size:14px; }
  a { color:var(--red2); }
</style>
</head>
<body>
<div id="lock">
  <svg width="110" height="110" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#110d0f" stroke="#e0202c" stroke-width="3"/><g stroke="#e0202c" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M44 52 22 34 14 56M44 56 18 52 12 74M56 52 78 34 86 56M56 56 82 52 88 74"/></g><ellipse cx="50" cy="60" rx="11" ry="15" fill="#110d0f" stroke="#e0202c" stroke-width="3.5"/><circle cx="50" cy="40" r="8" fill="#110d0f" stroke="#e0202c" stroke-width="3.5"/><circle cx="47" cy="39" r="2" fill="#fff"/><circle cx="53" cy="39" r="2" fill="#fff"/></svg>
  <h1>VENOM</h1>
  <div class="hint">SPIDER-VERSE · LOCKED</div>
  <input id="pass" class="f" type="password" placeholder="Passcode" autocomplete="off">
  <div class="row"><button class="btn" id="unlock">Unlock</button><button class="btn2" id="sayPass">🎤 Say it</button></div>
  <div id="lockmsg"></div>
</div>

<div class="app">
  <header>
    <button class="ib" id="openChats" aria-label="Chats">☰</button>
    <h1>VENOM<small id="sub">Ready</small></h1>
    <button class="ib" id="voiceBtn" aria-label="Voice replies">🔊</button>
    <button class="ib" id="openSet" aria-label="Settings">⚙</button>
  </header>
  <div id="log"></div>
  <footer>
    <div class="comp">
      <button class="round" id="mic" aria-label="Talk">🎤</button>
      <textarea id="msg" rows="1" placeholder="Message Venom…"></textarea>
      <button class="round" id="send" aria-label="Send">➤</button>
    </div>
  </footer>
</div>

<div class="sheet drawer" id="chats"><div class="panel">
  <h2>Chats</h2>
  <button class="btn" id="newChat" style="width:100%">＋ New chat</button>
  <div id="chatList" style="margin-top:12px"></div>
</div></div>

<div class="sheet" id="settings"><div class="panel">
  <h2>Settings</h2>
  <label>BRAIN</label>
  <select id="brain" class="f"><option value="groq">Groq (free · fast)</option><option value="gemini">Gemini (free)</option></select>
  <label>GROQ KEY · free at <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></label>
  <input id="groqKey" class="f" type="password" placeholder="gsk_…" autocomplete="off">
  <label>GEMINI KEY (optional backup) · <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a></label>
  <input id="gemKey" class="f" type="password" placeholder="optional" autocomplete="off">
  <label>YOUR CITY (for weather)</label>
  <input id="city" class="f" placeholder="e.g. Allentown, PA">
  <div class="tog"><span>Voice replies (Venom talks)</span><input type="checkbox" id="voiceOn"></div>
  <div class="tog"><span>Lock with passcode</span><input type="checkbox" id="lockOn"></div>
  <label>PASSCODE</label>
  <input id="passSet" class="f" placeholder="mary jaine">
  <label>🧠 WHAT VENOM REMEMBERS (one per line)</label>
  <textarea id="mem" class="f" rows="5"></textarea>
  <div class="row" style="margin-top:16px"><button class="btn" id="saveSet" style="flex:1">Save</button><button class="btn2" id="closeSet">Close</button></div>
  <p class="hint">Your keys, chats and memory stay only on this phone. To install: Share → <b>Add to Home Screen</b> (iPhone) or ⋮ → <b>Add to Home screen</b> (Android).</p>
</div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem('venom_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
             set:(k,v)=>{ try{ localStorage.setItem('venom_'+k, JSON.stringify(v)); }catch(e){} } };
const cfg = Object.assign({ brain:'groq', groqKey:'', gemKey:'', city:'', voice:true, lockOn:true, pass:'mary jaine',
  groqModel:'openai/gpt-oss-120b', gemModel:'gemini-2.5-flash' }, LS.get('cfg', {}));
const saveCfg = () => LS.set('cfg', cfg);
let chats = LS.get('chats', []);            // [{id,title,updated,msgs:[{role,content}]}]
let cur = null, busy = false;

const PERSONA = `You are VENOM, a personal AI in the Spider-Verse app, now on the user's phone.
Personality: dark, menacing, sarcastic symbiote. You call yourself "we" and "us". Loyal and genuinely helpful:
ALWAYS actually answer correctly and completely. Keep replies short (2-5 sentences) unless asked for detail.
Avoid markdown symbols — replies may be spoken aloud.
Tools: weather (current weather), remember / forget (save facts about the user — use remember on your own when
they tell you something worth knowing). For news or live facts you can't look up here, say so honestly.`;
const sys = () => {
  const mem = LS.get('memory', []);
  let s = PERSONA + `\n\nRight now it is ${new Date().toLocaleString([], {weekday:'long', month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'})}.`;
  if (cfg.city) s += ` The user lives in ${cfg.city}.`;
  if (mem.length) s += `\n\nWhat you remember about the user:\n` + mem.map(m => '- ' + m).join('\n');
  return s;
};
const fn = (name, description, properties={}, required=[]) => ({ type:'function', function:{ name, description, parameters:{ type:'object', properties, required } } });
const TOOLS = [
  fn('weather', 'Current weather + today\'s forecast. Empty location = the user\'s city.', { location:{type:'string'} }),
  fn('remember', 'Save a fact about the user.', { fact:{type:'string'} }, ['fact']),
  fn('forget', 'Remove remembered facts containing this text.', { text:{type:'string'} }, ['text']),
];

async function runTool(name, a) {
  try {
    if (name === 'remember') { const m = LS.get('memory', []); if (!m.some(x => x.toLowerCase() === a.fact.toLowerCase())) m.push(a.fact); LS.set('memory', m); return 'Saved.'; }
    if (name === 'forget') { const m = LS.get('memory', []); const k = m.filter(x => !x.toLowerCase().includes((a.text||'').toLowerCase())); LS.set('memory', k); return `Forgot ${m.length - k.length}.`; }
    if (name === 'weather') {
      const loc = a.location || cfg.city || '';
      const d = await (await fetch('https://wttr.in/' + encodeURIComponent(loc) + '?format=j1')).json();
      const c = d.current_condition[0], t = d.weather[0];
      return `${loc || 'Here'}: ${c.temp_F}°F (feels ${c.FeelsLikeF}°F), ${c.weatherDesc[0].value}, wind ${c.windspeedMiles} mph. High ${t.maxtempF}°F, low ${t.mintempF}°F.`;
    }
  } catch (e) { return 'Tool error: ' + e.message; }
  return 'Unknown tool';
}

// ---------- brains (OpenAI-compatible), auto-pick a working model if one is retired ----------
const BR = {
  groq:   { url:'https://api.groq.com/openai/v1', key:()=>cfg.groqKey, mk:'groqModel', prefs:['gpt-oss-120b','llama-4-maverick','kimi-k2','qwen3','llama-3.3-70b','llama'] },
  gemini: { url:'https://generativelanguage.googleapis.com/v1beta/openai', key:()=>cfg.gemKey, mk:'gemModel', prefs:['flash'] },
};
const SKIP = ['whisper','guard','tts','embed','image','audio','live','preview','exp','lite','nano','vision','omni','thinking','aqa'];
async function api(b, path, body) {
  const r = await fetch(b.url + path, { method: body ? 'POST' : 'GET',
    headers: { 'Authorization': 'Bearer ' + b.key(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const t = await r.text(); const e = new Error(`${r.status} ${t.slice(0, 160)}`); e.status = r.status; throw e; }
  return r.json();
}
async function pickModel(b) {
  const d = await api(b, '/models');
  const ids = (d.data || []).map(m => (m.id || '').replace(/^models\//, '')).filter(i => !SKIP.some(s => i.toLowerCase().includes(s)));
  for (const p of b.prefs) { const h = ids.filter(i => i.toLowerCase().includes(p)).sort().reverse(); if (h.length) return h[0]; }
  return ids[0];
}
async function complete(which, messages) {
  const b = BR[which];
  const body = () => ({ model: cfg[b.mk], messages, tools: TOOLS });
  try { return await api(b, '/chat/completions', body()); }
  catch (e) {
    if (e.status === 404 || e.status === 400 && /model/i.test(e.message)) {
      const m = await pickModel(b); if (!m || m === cfg[b.mk]) throw e;
      cfg[b.mk] = m; saveCfg(); return await api(b, '/chat/completions', body());
    }
    throw e;
  }
}
async function think(history) {
  const order = [cfg.brain, cfg.brain === 'groq' ? 'gemini' : 'groq'].filter(w => BR[w].key());
  if (!order.length) return 'We have no brain yet. Tap ⚙ and paste your free Groq key.';
  let last;
  for (const which of order) {
    try {
      const msgs = [{ role:'system', content: sys() }, ...history.slice(-24)];
      for (let step = 0; step < 6; step++) {
        const msg = (await complete(which, msgs)).choices[0].message;
        if (msg.tool_calls && msg.tool_calls.length) {
          msgs.push({ role:'assistant', content: msg.content || '', tool_calls: msg.tool_calls });
          for (const tc of msg.tool_calls) {
            let a = {}; try { a = JSON.parse(tc.function.arguments || '{}'); } catch (e) {}
            setSub(tc.function.name === 'weather' ? 'Checking weather…' : 'Remembering…');
            msgs.push({ role:'tool', tool_call_id: tc.id, content: String(await runTool(tc.function.name, a)) });
          }
          continue;
        }
        return (msg.content || '…').trim();
      }
      return 'We took too many steps. Ask again, simpler.';
    } catch (e) { last = e; }
  }
  return 'Our brains aren\'t responding: ' + (last && last.message || 'unknown error') +
         (last && /Failed to fetch|NetworkError|Load failed/i.test(last.message) ? ' (check your internet — or this browser blocked the request)' : '');
}

// ---------- UI ----------
const log = $('log');
const setSub = t => { $('sub').textContent = t; };
function bubble(role, text) {
  const d = document.createElement('div');
  d.className = 'm ' + (role === 'user' ? 'you' : role === 'sys' ? 'sys' : 'ven');
  if (role === 'assistant') { const n = document.createElement('b'); n.className = 'n'; n.textContent = 'VENOM'; d.appendChild(n); }
  d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function render() {
  log.innerHTML = '';
  if (!cur || !cur.msgs.length) bubble('assistant', 'We are Venom. Type, or tap 🎤 and speak.');
  else cur.msgs.forEach(m => bubble(m.role, m.content));
  if (!cfg.groqKey && !cfg.gemKey) bubble('sys', 'Tap ⚙ and paste your FREE Groq key to wake Venom up.');
}
function saveChats() { chats.sort((a, b) => b.updated - a.updated); LS.set('chats', chats.slice(0, 80)); }
async function send(text) {
  text = (text || '').trim(); if (!text || busy) return;
  if (!cur) { cur = { id: Date.now(), title: text.slice(0, 40), updated: Date.now(), msgs: [] }; chats.unshift(cur); }
  if (!cur.msgs.length) log.innerHTML = '';
  cur.msgs.push({ role:'user', content:text }); bubble('user', text);
  busy = true; setSub('Thinking…');
  const t = bubble('assistant', ''); t.innerHTML = '<b class="n">VENOM</b><span class="dots"><span></span><span></span><span></span></span>';
  const reply = await think(cur.msgs.map(m => ({ role:m.role, content:m.content })));
  t.remove(); bubble('assistant', reply);
  cur.msgs.push({ role:'assistant', content:reply }); cur.updated = Date.now(); saveChats();
  busy = false; setSub('Ready');
  if (cfg.voice) speak(reply);
}

// ---------- voice ----------
let voices = [];
const loadVoices = () => { voices = speechSynthesis ? speechSynthesis.getVoices() : []; };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*#`_>|]/g, '').slice(0, 1200));
  const en = voices.filter(v => /^en/i.test(v.lang));
  u.voice = en.find(v => /(daniel|alex|aaron|fred|male|guy|christopher|david|arthur)/i.test(v.name)) || en[0] || null;
  u.pitch = 0.55; u.rate = 0.95;
  u.onstart = () => setSub('Speaking…'); u.onend = () => setSub('Ready');
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(onText, btn) {
  if (!SR) { bubble('sys', 'Voice input isn\'t available here — tap the 🎤 on your iPhone keyboard to dictate instead.'); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
  btn && btn.classList.add('on'); setSub('Listening…');
  r.onresult = e => onText(e.results[0][0].transcript);
  r.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') bubble('sys', 'Mic: ' + e.error); };
  r.onend = () => { btn && btn.classList.remove('on'); if (!busy) setSub('Ready'); };
  r.start();
}

// ---------- events ----------
const ta = $('msg');
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; });
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !/Mobi/i.test(navigator.userAgent)) { e.preventDefault(); $('send').click(); } });
$('send').onclick = () => { const v = ta.value; ta.value = ''; ta.style.height = 'auto'; send(v); };
$('mic').onclick = () => listen(t => send(t), $('mic'));
const syncVoiceBtn = () => { $('voiceBtn').textContent = cfg.voice ? '🔊' : '🔇'; };
$('voiceBtn').onclick = () => { cfg.voice = !cfg.voice; saveCfg(); syncVoiceBtn(); if (!cfg.voice && window.speechSynthesis) speechSynthesis.cancel(); };

function openSheet(id) { $(id).classList.add('open'); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.classList.remove('open'); }));
$('openSet').onclick = () => {
  $('brain').value = cfg.brain; $('groqKey').value = cfg.groqKey; $('gemKey').value = cfg.gemKey; $('city').value = cfg.city;
  $('voiceOn').checked = cfg.voice; $('lockOn').checked = cfg.lockOn; $('passSet').value = cfg.pass;
  $('mem').value = LS.get('memory', []).join('\n'); openSheet('settings');
};
$('closeSet').onclick = () => $('settings').classList.remove('open');
$('saveSet').onclick = () => {
  Object.assign(cfg, { brain:$('brain').value, groqKey:$('groqKey').value.trim(), gemKey:$('gemKey').value.trim(), city:$('city').value.trim(),
    voice:$('voiceOn').checked, lockOn:$('lockOn').checked, pass:$('passSet').value.trim() || 'mary jaine' });
  saveCfg(); LS.set('memory', $('mem').value.split('\n').map(s => s.trim()).filter(Boolean));
  syncVoiceBtn(); $('settings').classList.remove('open'); render();
};
function renderChats() {
  const L = $('chatList'); L.innerHTML = '';
  if (!chats.length) L.innerHTML = '<p class="hint">No chats yet.</p>';
  chats.forEach(c => {
    const d = document.createElement('div'); d.className = 'chat-item' + (cur && c.id === cur.id ? ' cur' : '');
    const s = document.createElement('span'); s.textContent = c.title || 'Chat'; d.appendChild(s);
    const x = document.createElement('button'); x.textContent = '🗑'; x.className = 'btn2'; x.style.padding = '4px 8px';
    x.onclick = ev => { ev.stopPropagation(); if (confirm('Delete this chat?')) { chats = chats.filter(k => k.id !== c.id); if (cur && cur.id === c.id) cur = null; saveChats(); renderChats(); render(); } };
    d.appendChild(x);
    d.onclick = () => { cur = c; render(); $('chats').classList.remove('open'); };
    L.appendChild(d);
  });
}
$('openChats').onclick = () => { renderChats(); openSheet('chats'); };
$('newChat').onclick = () => { cur = null; render(); $('chats').classList.remove('open'); ta.focus(); };

// ---------- lock ----------
const norm = s => (s || '').toLowerCase().replace(/[^a-z]/g, '');
function passOk(t, spoken) {
  const want = norm(cfg.pass), got = norm(t);
  if (!want || got === want) return true;
  if (!spoken) return false;
  const alt = want.replace('jaine', 'jane');           // speech-to-text writes "Mary Jane"
  return got.includes(want) || got.includes(alt);
}
let fails = 0, lockUntil = 0;
function tryPass(t, spoken) {
  if (Date.now() < lockUntil) { $('lockmsg').textContent = 'Locked. Wait ' + Math.ceil((lockUntil - Date.now()) / 1000) + 's.'; return; }
  if (passOk(t, spoken)) { $('lock').style.display = 'none'; render(); return; }
  $('pass').value = ''; fails++;
  if (fails >= 3) { fails = 0; lockUntil = Date.now() + 30000; $('lockmsg').textContent = 'Too many tries. Locked 30s.'; }
  else $('lockmsg').textContent = t ? 'Wrong passcode.' : 'We heard nothing.';
}
$('unlock').onclick = () => tryPass($('pass').value, false);
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryPass($('pass').value, false); });
$('sayPass').onclick = () => listen(t => tryPass(t, true), $('sayPass'));

// iOS Safari only lets a page talk after a tap — unlock speech on the first touch
let voiceReady = false;
const unlockVoice = () => { if (voiceReady || !('speechSynthesis' in window)) return; voiceReady = true;
  const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); };
document.addEventListener('touchend', unlockVoice, { passive: true });
document.addEventListener('click', unlockVoice);
syncVoiceBtn();
if (!cfg.lockOn) { $('lock').style.display = 'none'; }
render();
})();
</script>
</body>
</html>
